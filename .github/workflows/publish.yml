name: Stage MCP package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_stage:
        description: "Confirm staging the verified package for maintainer review on npm"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    if: github.event_name == 'push' || inputs.confirm_stage == true
    name: Verify and stage package through npm OIDC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI with staged publishing and OIDC support
        run: |
          npm install --global npm@11.15.0
          npm --version

      - name: Install MCP package dependencies
        working-directory: packages/mcp-server
        run: npm install --no-audit --no-fund

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        working-directory: packages/mcp-server
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag v$TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          }

      - name: Typecheck
        working-directory: packages/mcp-server
        run: npm run typecheck

      - name: Unit tests
        working-directory: packages/mcp-server
        run: npm test

      - name: Build
        working-directory: packages/mcp-server
        run: npm run build

      - name: Verify the exact package layout and MCP STDIO behavior
        working-directory: packages/mcp-server
        run: npm run test:package

      - name: Stage package with npm Trusted Publishing (OIDC)
        working-directory: packages/mcp-server
        run: npm stage publish --access public
