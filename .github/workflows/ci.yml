name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build and package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install MCP package dependencies
        working-directory: packages/mcp-server
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: packages/mcp-server
        run: npm run typecheck

      - name: Unit tests
        working-directory: packages/mcp-server
        run: npm test

      - name: Build
        working-directory: packages/mcp-server
        run: npm run build

      - name: Verify the packed npm package over real MCP STDIO
        working-directory: packages/mcp-server
        run: npm run test:package
